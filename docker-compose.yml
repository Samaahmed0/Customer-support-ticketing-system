# Customer Support Ticketing — single stack. Pick an environment file:
#   docker compose --env-file .env.development up -d
# Switch environments: docker compose --env-file .env.development down
# then up with another env file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketing

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      # Non-guest user required for AMQP from other containers (guest is localhost-only).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticketing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-ticketing}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing

  ticket-service:
    build:
      context: .
      dockerfile: docker/ticket-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: ticket-service
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} ${UVICORN_EXTRA_ARGS}
    ports:
      - "${TICKET_HOST_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketing

  support-service:
    build:
      context: .
      dockerfile: docker/support-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      TICKET_SERVICE_URL: http://ticket-service:8000
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: support-service
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} ${UVICORN_EXTRA_ARGS}
    ports:
      - "${SUPPORT_HOST_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ticket-service:
        condition: service_started
    networks:
      - ticketing

  reporting-service:
    build:
      context: .
      dockerfile: docker/reporting-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: reporting-service
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} ${UVICORN_EXTRA_ARGS}
    ports:
      - "${REPORTING_HOST_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketing

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service/Dockerfile
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: notification-service
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} ${UVICORN_EXTRA_ARGS}
    ports:
      - "${NOTIFICATION_HOST_PORT:-8004}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketing

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      - ticket-service
      - support-service
      - reporting-service
    networks:
      - ticketing

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - ticket-service
      - support-service
      - reporting-service
      - notification-service
    networks:
      - ticketing

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - ticketing

  loki:
    # Shipped local-config is enough for coursework; avoids Loki 3.x schema drift.
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    networks:
      - ticketing

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - ticketing

volumes:
  postgres_data:

networks:
  ticketing:
    driver: bridge
