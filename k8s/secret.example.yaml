# Copy to secret.yaml, edit credentials, apply. Keep passwords in sync with URL fields.
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ticketing-secrets
  namespace: ticketing
type: Opaque
stringData:
  postgres-password: "change-me"
  rabbitmq-password: "change-me"
  database-url: "postgresql://ticketing:change-me@postgres:5432/ticketing"
  rabbitmq-url: "amqp://ticketing:change-me@rabbitmq:5672/"
