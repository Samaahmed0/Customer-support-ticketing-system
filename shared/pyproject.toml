[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketing-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "pydantic-settings>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ticketing_shared*"]
